services:
  tls-relay:
    build:
      context: ./relay
    restart: unless-stopped
    environment:
      VPN_GATEWAY_HOST: ${VPN_GATEWAY_HOST:?Set VPN_GATEWAY_HOST in .env}
      VPN_GATEWAY_PORT: ${VPN_GATEWAY_PORT:?Set VPN_GATEWAY_PORT in .env}
      VPN_RELAY_PORT: ${VPN_RELAY_PORT:?Set VPN_RELAY_PORT in .env}
    expose:
      - "${VPN_RELAY_PORT:?Set VPN_RELAY_PORT in .env}"

  topsap:
    build:
      context: .
      args:
        TOPSAP_DEB: ${TOPSAP_DEB:?Set TOPSAP_DEB in .env}
    restart: unless-stopped
    depends_on:
      - tls-relay
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:${SOCKS_HOST_PORT:?Set SOCKS_HOST_PORT in .env}:1080"
      - "${SSH_FORWARD_BIND_ADDRESS:?Set SSH_FORWARD_BIND_ADDRESS in .env}:${SSH_FORWARD_HOST_PORT:?Set SSH_FORWARD_HOST_PORT in .env}:${SSH_FORWARD_LISTEN_PORT:?Set SSH_FORWARD_LISTEN_PORT in .env}"
    environment:
      VPN_USERNAME_FILE: /run/secrets/vpn_username
      VPN_PASSWORD_FILE: /run/secrets/vpn_password
      VPN_TOTP_FILE: /run/secrets/vpn_totp
      VPN_KICK_EXISTING: ${VPN_KICK_EXISTING:?Set VPN_KICK_EXISTING in .env}
      VPN_CONNECT_ADDRESS: tls-relay:${VPN_RELAY_PORT:?Set VPN_RELAY_PORT in .env}
      SSH_TARGET: ${SSH_TARGET:?Set SSH_TARGET in .env}
      SSH_TARGET_PORT: ${SSH_TARGET_PORT:?Set SSH_TARGET_PORT in .env}
      SSH_FORWARD_LISTEN_PORT: ${SSH_FORWARD_LISTEN_PORT:?Set SSH_FORWARD_LISTEN_PORT in .env}
    secrets:
      - vpn_username
      - vpn_password
      - vpn_totp

secrets:
  vpn_username:
    file: ./secrets/vpn_username
  vpn_password:
    file: ./secrets/vpn_password
  vpn_totp:
    file: ./secrets/vpn_totp
